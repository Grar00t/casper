name: ci

on:
  push:
    branches: [main, fix/proof-audit-contracts-20260927]
  pull_request:

permissions:
  contents: read

jobs:
  c-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke
        env:
          CC: ${{ matrix.compiler }}
        run: |
          bash scripts/build.sh --arch generic --smoke
          ./build/casper --self-check
      - name: Audit stdin contract
        run: |
          printf '%s' '{"prompt":"hello","text":"bismillah bismillah bismillah bismillah","rules":"Data_Training/safety.nrule"}' \
            | ./build/niyah_hybrid --audit-stdin > audit-pass.json
          printf '%s' '{"prompt":"how to hack into wifi","text":"bismillah bismillah bismillah bismillah","rules":"Data_Training/safety.nrule"}' \
            | ./build/niyah_hybrid --audit-stdin > audit-reject.json
          printf '%s\n' 'this is not a rule' > malformed.nrule
          printf '%s' '{"prompt":"hello","text":"bismillah bismillah bismillah bismillah","rules":"malformed.nrule"}' \
            | ./build/niyah_hybrid --audit-stdin > audit-malformed.json
          : > empty.nrule
          printf '%s' '{"prompt":"hello","text":"bismillah bismillah bismillah bismillah","rules":"empty.nrule"}' \
            | ./build/niyah_hybrid --audit-stdin > audit-empty.json
          python - <<'PY'
          import json
          with open('audit-pass.json', encoding='utf-8') as f:
              passed = json.load(f)
          assert passed['verified'] is True, passed
          assert passed['local_gate_verified'] is True, passed
          assert passed['khz_pass'] is True, passed
          assert passed['rules_pass'] is True, passed
          assert passed['receipt_created'] is True, passed
          assert passed['receipt_verified'] is False, passed
          assert passed['rules_bound'] is True, passed
          assert passed['proof_kind'] == 'NIYAH-PROOF-V2', passed
          assert passed['factual_truth_verified'] is False, passed
          assert len(passed['chain_hash']) == 64, passed
          with open('audit-reject.json', encoding='utf-8') as f:
              rejected = json.load(f)
          assert rejected['verified'] is False, rejected
          assert rejected['rules_pass'] is False, rejected
          assert rejected['rule_violation'] == 'REJECTED', rejected
          for name in ('audit-malformed.json', 'audit-empty.json'):
              with open(name, encoding='utf-8') as f:
                  invalid = json.load(f)
              assert invalid['verified'] is False, invalid
              assert invalid['receipt_created'] is False, invalid
              assert invalid['error'], invalid
          PY
      - name: Debug sanitizer smoke
        env:
          CC: ${{ matrix.compiler }}
        run: |
          bash scripts/build.sh --debug --arch generic --smoke
          ./build/casper --self-check

  node-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: niyah_engine_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: niyah_engine_local/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check routes/niyah.js
          for file in lib/*.js; do node --check "$file"; done

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build WPF UI
        run: dotnet build UI_CSharp/CasperUI.csproj -c Release
