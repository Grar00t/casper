name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  c-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke
        env:
          CC: ${{ matrix.compiler }}
        run: |
          bash scripts/build.sh --arch generic --smoke
          ./build/casper --self-check
      - name: Debug sanitizer smoke
        env:
          CC: ${{ matrix.compiler }}
        run: |
          bash scripts/build.sh --debug --arch generic --smoke
          ./build/casper --self-check

  python-training-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile training tools
        run: |
          python -m py_compile tools/train_casper.py
          python -m py_compile tools/generate_teacher_dataset.py

  node-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: niyah_engine_local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: niyah_engine_local/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check routes/niyah.js
          for file in lib/*.js; do node --check "$file"; done

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build WPF UI
        run: dotnet build UI_CSharp/CasperUI.csproj -c Release
